# CI for the Android app under /android. The desktop pipeline is test.yml and
# the two never run for each other's changes — see the paths filters here and
# the paths-ignore filters there.
#
# The debug APK uploaded by this workflow is how each milestone reaches a real
# phone. It is not signed for release; AM11 adds android-release.yml for that.

name: Android CI

# The parity step below runs the DESKTOP'S own loader and diffs its field map
# against dataclasses.fields(saat.models.Watch), which makes those desktop files
# inputs to this workflow even though they sit outside android/. Filtering on
# android/** alone meant a field renamed on the desktop went unchecked until the
# next unrelated Android push — arriving months later, and reading as an Android
# regression when it is nothing of the sort. docs/schema.md is listed for the
# same reason: it is the shared contract both apps are measured against.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
      - 'saat/models.py'
      - 'saat/storage.py'
      - 'docs/schema.md'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
      - 'saat/models.py'
      - 'saat/storage.py'
      - 'docs/schema.md'

# No `branches:` restriction, deliberately. Every working branch gets CI,
# because AM1's own verification depends on reading real Actions runs.

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      # ubuntu-24.04 already ships a JDK and the Android SDK, so there is no
      # setup-android step and no licence dance. Pinned rather than -latest,
      # matching the desktop workflow's stated discipline.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # No build-root-directory input: it is not a valid input for this action
      # and was silently ignored. `defaults.run.working-directory` above is what
      # actually puts Gradle in android/. Wrapper checksum validation is on by
      # default and scans the repository, so the pinned wrapper is verified here.
      - uses: gradle/actions/setup-gradle@v6

      # AM2's acceptance criterion is parity with the desktop app, so CI runs the
      # DESKTOP'S OWN CODE against what Android writes rather than a second
      # implementation of it that could quietly drift. That is affordable because
      # saat/storage.py has no GUI dependency at all — it imports tomlkit and the
      # standard library and nothing else — so one pip install buys the real
      # loader. Pinned to the version requirements.txt pins, so both apps are
      # measured against one parser.
      #
      # This step writes a fully-populated watch.toml with the desktop's real
      # writer; DesktopParityTest reads it back and asserts every field arrives,
      # and that the fixture embedded in the test sources still matches it.
      - name: Write a desktop-authored fixture for the Android tests
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check tomlkit==0.15.1
          python3 android/tools/parity_check.py emit android/app/build/parity-in

      # AM5 gave the Android form ninety-nine suggested enum* values, and every
      # one of them is DATA — the canonical English string is what lands in
      # watch.toml and what the desktop reads back. A value respelled on one
      # side fails nothing: not the field-map diff (the field is still there),
      # not a round trip (the string survives), not any unit test. It just means
      # the two apps offer different vocabularies for the same field, and a
      # collection edited on both grows two spellings of everything. So the
      # lists are diffed directly, parsed from both sources.
      #
      # Before `check` rather than after, because it needs no build output and a
      # four-minute Gradle run should not stand between a typo and its message.
      - name: Verify the enum* lists still match the desktop's
        working-directory: ${{ github.workspace }}
        run: python3 android/tools/parity_check.py enums .

      # `check` runs, in order: buildSrc's own tests (the guardian's guardian,
      # finalized onto the jar Gradle must build anyway), the app's unit tests,
      # and verifyDebugManifestPolicy + verifyReleaseManifestPolicy. The release
      # manifest is verified without assembling a release APK.
      - name: Check
        run: ./gradlew --no-daemon check

      # The other direction, and the one only the desktop can answer: load the
      # TOML the Kotlin tests just wrote using saat.storage.load_collection and
      # assert every field survived WITH ITS TYPE — a date that came back as a
      # string fails here, and that is precisely the failure that would otherwise
      # wait until AM10's ZIP bridge to be discovered. Then diff the field map
      # the encoder produced against dataclasses.fields() on saat/models.py, so a
      # schema field missing, renamed or misspelled on the Android side fails the
      # build instead of surfacing as an empty row in AM4.
      - name: Verify parity against the desktop's own loader
        working-directory: ${{ github.workspace }}
        run: python3 android/tools/parity_check.py verify android/app/build/reports/parity

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      # if-no-files-found: error so a silent empty upload is impossible — an
      # artifact that exists but contains nothing is worse than a failed build.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: saat-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The measurements behind the AM1 TOML library choice, and the emitted
      # TOML that gets parsed with the desktop's own tomlkit to prove
      # cross-platform compatibility.
      - name: Upload TOML evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toml-eval-${{ github.sha }}
          path: android/app/build/reports/toml-eval/
          if-no-files-found: warn

      # What each implementation wrote for the other, kept whether the parity
      # step passed or failed — when it fails, these two files and a diff are the
      # whole investigation.
      - name: Upload desktop parity artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-${{ github.sha }}
          path: |
            android/app/build/reports/parity/
            android/app/build/parity-in/
          if-no-files-found: warn

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/manifest-policy/
            android/buildSrc/build/reports/tests/
          if-no-files-found: warn
