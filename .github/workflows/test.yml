# CI green here means the automated suite (tests/) passes headless, under
# QT_QPA_PLATFORM=offscreen. That is NOT equivalent to this project's manual
# visual-verification practice -- a developer, in a real xcb/wayland session,
# eyeballing contrast and layout via actual screenshots. That practice stays
# manual on purpose; this workflow does not attempt to replace it.

name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: run.sh

      # Only what the offscreen QPA plugin itself needs to load -- verified
      # below by ldd against the real libqoffscreen.so, not carried over from
      # the xcb platform plugin's (much longer) dependency list, which this
      # job never loads.
      - name: Install system libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxcb1 libx11-6 \
            libfontconfig1 libfreetype6 libglib2.0-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet PySide6 tomlkit Pillow

      - name: Verify offscreen plugin's shared-library deps resolve
        run: |
          PLUGIN=$(python -c "import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), 'Qt', 'plugins', 'platforms', 'libqoffscreen.so'))")
          ldd "$PLUGIN" | grep "not found" && exit 1 || echo "all resolved"

      - name: Run test suite
        run: python -m unittest discover -s tests -t .
