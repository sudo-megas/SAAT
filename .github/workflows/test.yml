# CI green here means the automated suite (tests/) passes headless, under
# QT_QPA_PLATFORM=offscreen. That is NOT equivalent to this project's manual
# visual-verification practice -- a developer, in a real xcb/wayland session,
# eyeballing contrast and layout via actual screenshots. That practice stays
# manual on purpose; this workflow does not attempt to replace it.
#
# Since milestone 24 the suite runs on Windows as well. The same caveat
# applies twice over there: a green Windows run means the suite passes, not
# that anyone has seen SAAT draw a window on Windows.

name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  QT_QPA_PLATFORM: offscreen
  # A bare runner has no locale configured at all, so Qt's QLocale() falls
  # back to Language.C -- unlike any real desktop this app targets, which
  # always has some locale set. Several i18n tests assert against an
  # English ambient default, matching a real machine, not a locale-less
  # container. Harmless on Windows, which resolves locale from the OS.
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  test:
    strategy:
      # Both platforms always report. A Windows-only failure must not hide
      # behind a cancelled Linux job, or the reverse -- for a milestone
      # whose whole point is that the two can diverge, which one broke is
      # the information.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # bash on both, via Git Bash on Windows, so the steps below stay one
    # script rather than two. Declared explicitly: the default shell on a
    # Windows runner is PowerShell, and every `run:` here is POSIX shell.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          # Keys the pip cache on the file that actually decides what gets
          # installed. This pointed at run.sh, which no longer names a
          # package at all -- so the cache key never moved when a
          # dependency changed, and did move when an unrelated line of
          # shell did.
          cache-dependency-path: requirements.txt

      # Only what the offscreen QPA plugin itself needs to load -- verified
      # below by ldd against the real libqoffscreen.so, not carried over from
      # the xcb platform plugin's (much longer) dependency list, which this
      # job never loads. Windows needs none of it: the platform plugin's
      # dependencies are in the OS or already in the wheel.
      - name: Install system libraries for headless Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxcb1 libx11-6 \
            libfontconfig1 libfreetype6 libglib2.0-0 libdbus-1-3

      # requirements.txt is the single declaration of the runtime three
      # (SPEC.md §2 rule 5) -- run.sh, run.ps1 and release.yml install from
      # the same file. No package names inline in a workflow.
      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Verify offscreen plugin's shared-library deps resolve
        if: runner.os == 'Linux'
        run: |
          PLUGIN=$(python -c "import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), 'Qt', 'plugins', 'platforms', 'libqoffscreen.so'))")
          ldd "$PLUGIN" | grep "not found" && exit 1 || echo "all resolved"

      - name: Run test suite
        run: python -m unittest discover -s tests -t .
