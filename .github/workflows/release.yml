# ubuntu-22.04, deliberately not ubuntu-latest: this is the whole point of
# the milestone. It's the oldest GA runner image GitHub currently offers,
# which means the oldest glibc (2.35) of any supported runner. glibc is
# forward- but not backward-compatible, so building here gives the widest
# downstream compatibility achievable on a GitHub-hosted runner today --
# Ubuntu 22.04+, Debian 12+, Fedora 36+, Mint 21+, and current Arch.
# (PySide6's own wheel is manylinux_2_34, so 2.35 is the runner's floor,
# not the wheel's -- the runner is the binding constraint.)
#
# Decision, recorded rather than rediscovered later: stay on the
# `runs-on: ubuntu-22.04` runner label. Do NOT pre-emptively move to
# `container: ubuntu:22.04`.
#
#   Trigger condition -- migrate when, and only when, GitHub actually
#   deprecates the ubuntu-22.04 runner label. GitHub keeps at most 2 GA
#   images plus 1 preview and retires the oldest GA label once the newest
#   goes GA (ubuntu-26.04 is already in preview as of this writing, so
#   ubuntu-22.04 is next in line). Migrate to `container: ubuntu:22.04`
#   then -- never to ubuntu-latest, which would silently raise the glibc
#   floor again and reintroduce exactly the compatibility problem this
#   workflow exists to fix.
#
#   Why not now: a container loses the runner's passwordless sudo, and
#   changes what actions/setup-python and actions/checkout do (no
#   pre-installed tool cache, no git preinstalled). Every apt and python
#   step below would need reworking at the same time as whatever else is
#   in flight. That is a change worth making on its own, against a
#   pipeline that is otherwise known-good -- not folded into a milestone.
#
# CI green (this workflow, or test.yml) is not equivalent to this project's
# manual visual-verification practice -- see test.yml's own header comment.

name: Release

on:
  push:
    tags: ['v*']
  # Dry run. Runs every build, gate and smoke test below and leaves the
  # tarball as a downloadable workflow artifact, but publishes nothing:
  # the release job is gated on the tag-push event. Without this, every
  # packaging experiment (milestone 24's Windows/Inno Setup work is
  # expected to take several iterations) would cost a public tag and a
  # public release to find out whether the build works.
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  # See test.yml for why this is set -- the test suite run in this job's
  # gate step needs it for the same reason.
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  # One job per artifact. Adding a platform (the Windows installer in
  # milestone 24) means adding a sibling job here that uploads its own
  # named artifact, plus its job name in the release job's `needs:` list.
  # Nothing else below changes: the release job downloads whatever
  # artifacts exist rather than naming one.
  #
  # The `deb` job below is the exception to "one job per build": it does
  # not build anything, it wraps what this job produced. Two artifacts,
  # one build.
  build-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          # See test.yml -- this pointed at run.sh, which names no packages.
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      # A dry run has no tag, so it labels its tarball from __version__ plus
      # the short SHA -- never mistakable for a release artifact, and never
      # colliding with one in the artifact store.
      - name: Resolve build identity
        id: identity
        run: |
          VERSION=$(python -c "import saat; print(saat.__version__)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "label=v${VERSION}-dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Both halves of the release-discipline invariant (docs/DEVELOPMENT.md),
      # checked on a dry run too -- so a missing notes file or a stale
      # __version__ surfaces before a tag is spent, which is the whole
      # point of having a dry run.
      - name: Guard tag, __version__ and release notes agree
        run: |
          VERSION="${{ steps.identity.outputs.version }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            [ "$TAG_VERSION" = "$VERSION" ] || {
              echo "::error::tag $GITHUB_REF_NAME does not match saat.__version__ ($VERSION)"
              exit 1
            }
          fi
          test -f "docs/release-notes/${VERSION}.md" || {
            echo "::error::missing docs/release-notes/${VERSION}.md"
            exit 1
          }

      # Only what the offscreen QPA plugin itself needs to load -- see
      # test.yml for how this list was derived and verified.
      - name: Install system libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxcb1 libx11-6 \
            libfontconfig1 libfreetype6 libglib2.0-0 libdbus-1-3

      # The same pinned runtime three as test.yml and run.sh, plus the
      # build-only tooling kept in its own file so the runtime list stays
      # visibly three (SPEC.md §2 rule 5).
      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt -r requirements-build.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -t .

      # PyInstaller bundles whatever's already on disk under
      # saat/resources/i18n/ -- saat_tr.qm is gitignored and absent on a
      # fresh checkout, and a missing/stale .qm does not fail the build, it
      # silently falls back to English. This must run before pyinstaller.
      - name: Compile Turkish translation
        run: pyside6-lrelease saat/resources/i18n/saat_tr.ts -qm saat/resources/i18n/saat_tr.qm

      - name: Build with PyInstaller
        run: pyinstaller SAAT.spec

      - name: Create tarball
        run: |
          cd dist
          tar -czf SAAT-${{ steps.identity.outputs.label }}-linux-x86_64.tar.gz SAAT
          cd ..

      # Extracts the tarball itself (not the pre-tar dist/SAAT), so a broken
      # tar invocation would also be caught. This is a GUI event-loop app
      # with no --version/--help path -- it never exits on its own, so under
      # a timeout, exit codes 0/124/137/143 are all healthy-launch outcomes
      # and only anything else is a real failure. Also asserts three bundle
      # paths that a naive "did it exit 0" check would miss entirely:
      # PyInstaller ships silently even when the compiled translation or an
      # icon-engine plugin is absent.
      - name: Smoke-test the built tarball
        run: |
          set -e
          mkdir -p /tmp/smoke
          tar -xzf dist/SAAT-${{ steps.identity.outputs.label }}-linux-x86_64.tar.gz -C /tmp/smoke

          test -f /tmp/smoke/SAAT/_internal/resources/i18n/saat_tr.qm
          test -f /tmp/smoke/SAAT/_internal/ui/theme.qss
          test -f /tmp/smoke/SAAT/_internal/PySide6/Qt/plugins/iconengines/libqsvgicon.so

          set +e
          timeout --kill-after=5s 15s /tmp/smoke/SAAT/SAAT > /tmp/smoke.log 2>&1
          status=$?
          set -e

          case "$status" in
            0|124|137|143) echo "healthy launch (exit $status)" ;;
            *)
              echo "::error::SAAT exited $status within the smoke-test window"
              cat /tmp/smoke.log
              exit 1
              ;;
          esac

          if grep -iqE "could not load the qt platform plugin|Traceback \(most recent call last\)" /tmp/smoke.log; then
            echo "::error::smoke test log contains a known failure signature"
            cat /tmp/smoke.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: saat-linux-x86_64
          path: dist/SAAT-${{ steps.identity.outputs.label }}-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0

  # The .deb. Deliberately NOT a second PyInstaller build: it downloads the
  # tarball build-linux-x86_64 just produced and wraps that. One build, two
  # artifacts -- the tarball and the package are byte-identical inside and
  # cannot drift apart, which is the whole reason this is a separate job
  # rather than a second `pyinstaller SAAT.spec`.
  deb:
    needs: build-linux-x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: saat-linux-x86_64
          path: artifacts

      # Globbed rather than recomputing the build job's label: the tarball
      # is whatever that job uploaded, and there is exactly one.
      - name: Unpack the tarball this release is built from
        run: |
          set -euo pipefail
          tarball=$(ls artifacts/*.tar.gz)
          echo "unpacking $tarball"
          mkdir -p dist
          tar -xzf "$tarball" -C dist
          test -x dist/SAAT/SAAT

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian dpkg-dev

      # Runs packaging/audit-bundle.py as part of the build: Depends
      # completeness, the glibc floor, and copyright coverage are all
      # gates here, not advisories.
      - name: Build the package
        run: ./packaging/build-deb.sh --dist dist/SAAT --output dist

      # Two passes on purpose. The first prints everything lintian has to
      # say, at full verbosity and with no tag limit, so the report is in
      # the job log and can be read rather than guessed at -- including
      # info-level tags that are not failures. The second is the gate.
      - name: Report every lintian tag
        run: |
          lintian --display-info --display-experimental --show-overrides \
                  --no-tag-display-limit dist/*.deb || true

      - name: Gate on lintian errors and warnings
        run: |
          lintian --fail-on error,warning --no-tag-display-limit dist/*.deb

      - name: Install it the way a user would
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/saat_*.deb

      - name: The entry point exists and is what it claims to be
        run: |
          set -euo pipefail
          test -L /usr/bin/saat
          test -x /usr/bin/saat
          echo "/usr/bin/saat -> $(readlink -f /usr/bin/saat)"
          [ "$(readlink -f /usr/bin/saat)" = "/usr/lib/saat/SAAT" ]
          test -f /usr/lib/saat/.installed
          test -f /usr/share/applications/saat.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/saat.png
          test -f /usr/share/doc/saat/copyright
          test -f /usr/share/doc/saat/changelog.Debian.gz
          test -f /usr/share/man/man1/saat.1.gz

      # The build-time audit proved Depends names a package for every
      # external soname. This proves those were the right package names:
      # against a copy apt installed with only the declared dependencies,
      # an unresolved soname means a package that installs and then will
      # not start. Reasoning about Debian package names cannot catch that;
      # running ldd against the real thing can.
      - name: Every library the bundle needs actually resolves
        run: python3 packaging/audit-bundle.py --check-resolution /usr/lib/saat

      # Launching the installed /usr/bin/saat is the end-to-end proof that
      # installed-mode detection survives the symlink: if it did not, the
      # app would resolve its data directory to /usr/bin and these two
      # directories would never appear. A GUI event-loop app never exits on
      # its own, so under a timeout 0/124/137/143 are all healthy.
      - name: It starts, and resolves its data to the per-user locations
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          test ! -e "$HOME/.local/share/saat"
          test ! -e "$HOME/.config/saat"

          set +e
          timeout --kill-after=5s 20s /usr/bin/saat > /tmp/deb-smoke.log 2>&1
          status=$?
          set -e
          case "$status" in
            0|124|137|143) echo "healthy launch (exit $status)" ;;
            *)
              echo "::error::installed saat exited $status within the smoke-test window"
              cat /tmp/deb-smoke.log
              exit 1
              ;;
          esac
          if grep -iqE "could not load the qt platform plugin|Traceback \(most recent call last\)" /tmp/deb-smoke.log; then
            echo "::error::smoke test log contains a known failure signature"
            cat /tmp/deb-smoke.log
            exit 1
          fi

          test -d "$HOME/.local/share/saat"
          test -d "$HOME/.config/saat"
          echo "installed mode confirmed: data resolved to ~/.local/share/saat"

      # ==================================================================
      # The data-safety guarantee. This is the assertion milestone 23
      # exists to make automatic rather than eyeballed: uninstalling SAAT
      # must never destroy a collection, and `apt purge` -- which people
      # type meaning "remove it properly" -- must not either.
      #
      # If this step ever fails, the package is not shippable. There is no
      # version of "fix the test" that applies.
      # ==================================================================
      - name: A collection survives remove, and survives purge
        run: |
          set -euo pipefail
          watch_dir="$HOME/.local/share/saat/watches/a-watch-the-user-entered"
          mkdir -p "$watch_dir"
          printf 'brand = "Stub"\nmodel = "Purge Guard"\n' > "$watch_dir/watch.toml"
          printf 'stub = true\n' > "$HOME/.config/saat/config.toml"
          sha_before=$(sha256sum "$watch_dir/watch.toml" | cut -d' ' -f1)

          sudo apt-get remove -y saat
          test ! -e /usr/bin/saat
          test -f "$watch_dir/watch.toml" || {
            echo "::error::apt remove deleted the user's collection"
            exit 1
          }

          sudo apt-get purge -y saat
          test ! -e /usr/lib/saat
          test ! -e /usr/share/applications/saat.desktop

          test -f "$watch_dir/watch.toml" || {
            echo "::error::apt purge deleted the user's collection"
            exit 1
          }
          test -f "$HOME/.config/saat/config.toml" || {
            echo "::error::apt purge deleted the user's configuration"
            exit 1
          }
          [ "$(sha256sum "$watch_dir/watch.toml" | cut -d' ' -f1)" = "$sha_before" ] || {
            echo "::error::apt purge altered the user's collection"
            exit 1
          }
          echo "collection intact after remove and purge"

      - uses: actions/upload-artifact@v4
        with:
          name: saat-deb-amd64
          path: dist/saat_*.deb
          if-no-files-found: error
          compression-level: 0

  # Windows. Two artifacts from one build, the same shape as Linux: a
  # portable .zip that keeps its data beside the executable, and an Inno
  # Setup installer that writes the .installed marker and uses
  # %LOCALAPPDATA%/%APPDATA% instead.
  #
  # Unlike the Linux pair this cannot reuse another job's output -- a
  # Windows binary has to be built on a Windows runner -- so the zip and
  # the installer are both produced here, from one `pyinstaller` run.
  #
  # What this job CANNOT tell you: whether the installer's shortcuts land,
  # whether SmartScreen lets a user past, whether the fonts render, or
  # whether the tray behaves. A green build here is a build, not an
  # installation test. See docs/release-notes/2.1.md, which says so plainly
  # rather than implying otherwise.
  build-windows-x86_64:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Resolve build identity
        id: identity
        run: |
          $version = python -c "import saat; print(saat.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.event_name }}" -eq "push") {
            "label=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          } else {
            "label=v$version-dev-$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_OUTPUT
          }

      - name: Guard tag, __version__ and release notes agree
        run: |
          $version = "${{ steps.identity.outputs.version }}"
          if ("${{ github.event_name }}" -eq "push") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $version) {
              Write-Host "::error::tag $env:GITHUB_REF_NAME does not match saat.__version__ ($version)"
              exit 1
            }
          }
          if (-not (Test-Path "docs/release-notes/$version.md")) {
            Write-Host "::error::missing docs/release-notes/$version.md"
            exit 1
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt -r requirements-build.txt

      # The test suite runs on this platform too, from this milestone
      # onward -- see test.yml's matrix. Repeated here for the same reason
      # the Linux job repeats it: a release must never be built from a
      # commit whose tests were only ever green somewhere else.
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t .

      # Same ordering rule as Linux: SAAT.spec bundles whatever is already
      # on disk under saat/resources/i18n/, and the .qm is gitignored.
      - name: Compile Turkish translation
        run: pyside6-lrelease saat/resources/i18n/saat_tr.ts -qm saat/resources/i18n/saat_tr.qm

      - name: Build with PyInstaller
        run: pyinstaller SAAT.spec

      # Portable artifact. No .installed marker anywhere in it -- that is
      # what keeps it portable, and the assertion below is not decoration:
      # a marker leaking into the zip would silently move every portable
      # user's collection into their AppData.
      - name: Create the portable zip
        run: |
          if (Test-Path "dist\SAAT\.installed") {
            Write-Host "::error::the portable build contains an .installed marker"
            exit 1
          }
          Compress-Archive -Path dist\SAAT -DestinationPath "dist\SAAT-${{ steps.identity.outputs.label }}-windows-x64.zip" -CompressionLevel Optimal

      # Inno Setup is normally present on the windows runner image; the
      # fallback is here so a runner-image change cannot silently take the
      # installer out of a release.
      - name: Ensure Inno Setup is available
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not on the image -- installing it"
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            Write-Host "::error::Inno Setup is still not at $iscc"
            exit 1
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build the installer
        run: |
          & "$env:ISCC" "/DAppVersion=${{ steps.identity.outputs.version }}" packaging\windows\saat.iss
          Get-ChildItem dist\*.exe

      # Same reasoning as the Linux smoke test: this is a GUI event-loop
      # app with no --version path, so it never exits on its own and
      # "still running after 20 seconds" is the healthy outcome. Asserts
      # three bundle paths first, which a bare launch check would miss --
      # PyInstaller ships happily without the compiled translation or an
      # icon-engine plugin.
      - name: Smoke-test the portable build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"

          # A bare Test-Path prints True or False and fails nothing, so
          # each assertion has to act on the result.
          foreach ($required in @(
            "dist\SAAT\_internal\resources\i18n\saat_tr.qm",
            "dist\SAAT\_internal\ui\theme.qss"
          )) {
            if (-not (Test-Path $required -PathType Leaf)) {
              Write-Host "::error::missing from the bundle: $required"
              exit 1
            }
          }

          # PyInstaller has moved the Qt plugin root between versions, so
          # the plugin is looked for rather than asserted at one path.
          $iconEngine = Get-ChildItem -Recurse -Filter "qsvgicon.dll" dist\SAAT -ErrorAction SilentlyContinue
          if (-not $iconEngine) {
            Write-Host "::error::the SVG icon engine plugin is missing from the bundle"
            Get-ChildItem -Recurse -Directory -Filter "iconengines" dist\SAAT | Select-Object -First 5
            exit 1
          }

          $before = Test-Path "$env:LOCALAPPDATA\SAAT"
          $proc = Start-Process -FilePath "dist\SAAT\SAAT.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) {
            Write-Host "::error::SAAT.exe exited with $($proc.ExitCode) within the smoke-test window"
            exit 1
          }
          $proc.Kill()
          Write-Host "healthy launch (still running after 20s)"

          # A portable build must never touch the installed-mode location.
          if ((-not $before) -and (Test-Path "$env:LOCALAPPDATA\SAAT")) {
            Write-Host "::error::the portable build created $env:LOCALAPPDATA\SAAT -- it is not portable"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: saat-windows-x64
          path: |
            dist/SAAT-*-windows-x64.zip
            dist/SAAT-*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  release:
    # Every build job must succeed before anything is published, so a
    # second platform failing can never leave a half-populated release
    # behind.
    needs: [build-linux-x86_64, deb, build-windows-x86_64]
    # The dry run stops here: workflow_dispatch builds, tests and smoke-
    # tests, then leaves the artifact attached to the workflow run and
    # publishes nothing at all.
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # No `name:` -- downloads every artifact every build job uploaded,
      # merged into one flat directory. Adding a platform therefore needs
      # no change here at all.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Belt and braces alongside the job-level `if` above: publishing
          # is the one irreversible thing this workflow does.
          [ "${{ github.event_name }}" = "push" ] || {
            echo "::error::refusing to publish from a ${{ github.event_name }} event"
            exit 1
          }

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES="docs/release-notes/${VERSION}.md"
          test -f "$NOTES" || {
            echo "::error::missing $NOTES"
            exit 1
          }

          shopt -s nullglob
          ASSETS=(artifacts/*)
          [ ${#ASSETS[@]} -gt 0 ] || {
            echo "::error::no build artifacts were downloaded -- nothing to attach"
            exit 1
          }
          printf 'attaching: %s\n' "${ASSETS[@]}"

          # Idempotent, because re-running a tag has to be free. `gh release
          # create` errors outright when the release already exists, which
          # is what failed the first attempt at this release and is
          # guaranteed to recur once a milestone needs several passes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists -- updating it in place"
            gh release edit "$TAG" --title "SAAT $TAG" --notes-file "$NOTES"
          else
            # Created as a draft so a failure between here and the promote
            # step below leaves an unpublished draft rather than a public
            # release with some of its assets missing.
            gh release create "$TAG" --draft --title "SAAT $TAG" --notes-file "$NOTES"
          fi

          # --clobber overwrites an asset of the same name instead of
          # failing, so a re-run replaces a bad binary rather than being
          # blocked by it.
          gh release upload "$TAG" "${ASSETS[@]}" --clobber

          # Promote last, once every asset is attached. A no-op when the
          # release was already published, which is the re-run case -- an
          # existing published release is deliberately never forced back to
          # draft first, since that would briefly retract a live download.
          gh release edit "$TAG" --draft=false

          gh release view "$TAG" --json url,isDraft \
            -q '"published: " + .url + "  draft=" + (.isDraft|tostring)'
