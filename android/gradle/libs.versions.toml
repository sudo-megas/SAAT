[versions]
agp = "9.3.1"
kotlin = "2.4.10"
composeBom = "2026.06.01"

coreKtx = "1.19.0"
appcompat = "1.7.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"

# Evaluated against a watch-shaped fixture in TomlContractTest before being
# chosen. See the AM1a commit message for the measurements.
tomlkt = "0.6.1"
ktoml = "0.7.1"

junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

tomlkt = { group = "dev.eav.tomlkt", name = "tomlkt", version.ref = "tomlkt" }
ktoml-core = { group = "com.akuleshov7", name = "ktoml-core", version.ref = "ktoml" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

# Referenced from the root buildscript classpath rather than the plugins block:
# AGP 9 ships built-in Kotlin support and applying org.jetbrains.kotlin.android
# alongside it fails. Pinning the KGP version on the classpath is the documented
# way to override the version AGP would otherwise bring in.
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
