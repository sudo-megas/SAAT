# Nord -- nordtheme/nord, src/nord.scss, cross-checked byte-for-byte against
# the live nordtheme.com/docs/colors-and-palettes page.
# https://github.com/nordtheme/nord/blob/main/src/nord.scss
#
# Role mapping (Nord's own SassDoc):
#   plate       = nord0  ("base component color of Polar Night... for dark
#                          ambiance themes")
#   plate_high  = nord1  ("a lighter background color for UI elements like
#                          status bars")
#   rule        = nord2  (nearest structural step between plate and
#                          text_muted; Nord's docs don't name a dedicated
#                          border color)
#   text        = nord4  ("for dark ambiance themes, .text { color: $nord4 }")
#   text_muted  = nord3  ("used for comments, invisibles... disabled
#                          elements" -- Nord's own designated muted role)
#   gilt        = nord8  (explicit: "Bluish core accent color. Represents
#                          THE accent color of the color palette." -- the one
#                          unambiguous, hardcoded answer in this research)
#   ruby        = nord11 ("used for errors, git/diff deletion and linter
#                          marker")
#
# Two deliberate deviations from nord.scss, both reported per SPEC.md §6
# items 10/37 rather than invented around -- see the inline comments below
# for the exact substitution and measured ratio. Nord's 16-color system has
# no intermediate step between Polar Night's darkest (nord3) and Snow
# Storm's lightest (nord4, already assigned to primary text) for the first
# one, and nord11 is Nord's only red for the second -- both needed a value
# outside the authentic 16-color set entirely, unlike default-dark/-light's
# own nudges above (which stayed within values SAAT itself invented). A
# real user (2026-07-28) reported nord3's text_muted specifically as
# unreadable in the running app, not just a measured shortfall.
id = "nord"
name = "Nord"
is_dark = true

plate = "#2e3440"
plate_high = "#3b4252"
rule = "#434c5e"
text = "#d8dee9"
# nord3 (#4c566a) measured 1.69:1 on plate / 1.36:1 on plate-high, far under
# the 4.5:1 bar and confirmed illegible by a real user. Lightened within
# nord3's own hue (H=220 deg) rather than substituted from elsewhere in the
# 16-color set, since nothing else in Nord's own system sits between it and
# nord4: 5.66:1 on plate / 4.56:1 on plate-high.
text_muted = "#a6afc0"
gilt = "#88c0d0"
# nord11 (#bf616a) measured 3.05:1 on plate (passes 3:1) but 2.46:1 on
# plate-high (fails). Lightened within nord11's own hue (H=354 deg): 4.54:1
# on plate / 3.66:1 on plate-high.
ruby = "#cf8990"
