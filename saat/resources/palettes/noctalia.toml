# Noctalia -- the shell's own "Noctalia (default)" scheme, confirmed
# byte-identical across two independently maintained codebases: the v4.7.7
# QML/Quickshell generation and the current v5 C++ rewrite, both selecting
# it as the shipped default (dark mode).
# https://github.com/noctalia-dev/noctalia/blob/v4.7.7/Commons/Color.qml#L395-L421
# https://github.com/noctalia-dev/noctalia/blob/main/src/theme/builtin_palettes.cpp#L670-L690
# https://github.com/noctalia-dev/noctalia/blob/v4.7.7/Assets/settings-default.json#L502-L505
#
# Role mapping (Noctalia's own names):
#   plate       = mSurface
#   plate_high  = mSurfaceVariant
#   rule        = mOutline
#   text        = mOnSurface
#   text_muted  = mOnSurfaceVariant
#   gilt        = mPrimary  (pale yellow -- used 361 times across the shell's
#                             own UI for checked/active/highlighted state,
#                             far more than any other accent role; also the
#                             color of every badge in the project's README)
#   ruby        = mError
#
# Contrast: every role clears its bar with Noctalia's own published values
# as-is -- no substitution needed (text_muted 5.27:1/4.91:1, gilt
# 17.68:1/16.45:1, ruby 5.87:1/5.46:1).
id = "noctalia"
name = "Noctalia"
is_dark = true

plate = "#070722"
plate_high = "#11112d"
rule = "#21215F"
text = "#f3edf7"
text_muted = "#7c80b4"
gilt = "#fff59b"
ruby = "#FD4663"
